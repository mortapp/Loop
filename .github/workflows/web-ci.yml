name: web-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck
        run: npm run typecheck --workspace apps/web

      - name: Build
        run: npm run build --workspace apps/web

  e2e:
    runs-on: ubuntu-latest
    # Requires at minimum a real (non-secret-sensitive, see
    # docs/DESIGN_SYSTEM.md/.env.example rationale) Supabase anon key so
    # the dev server the tests hit can even resolve an unauthenticated
    # session; skipped entirely until the owner adds it as a repo secret.
    # QA_TEST_EMAIL/QA_TEST_PASSWORD are optional on top of that -- when
    # unset, only the always-safe auth-guard specs run (see
    # apps/web/playwright.config.ts and docs/KNOWN_ISSUES.md).
    if: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run E2E tests
        run: npm run test:e2e --workspace apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
          QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
