name: supabase-ci

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-ci.yml"

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local stack and apply migrations
        run: supabase db start

      - name: Reset (re-applies every migration + seed from empty)
        run: supabase db reset
