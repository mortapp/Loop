name: iOS Native CI

on:
  push:
    paths:
      - 'apps/ios-native/**'
      - '.github/workflows/ios-native-ci.yml'
  pull_request:
    paths:
      - 'apps/ios-native/**'
      - '.github/workflows/ios-native-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build native iOS simulator app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios-native
    steps:
      - uses: actions/checkout@v5
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Build without signing
        run: >-
          xcodebuild
          -project LOOP.xcodeproj
          -scheme LOOP
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
